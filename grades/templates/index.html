<!doctype html>
<meta charset="UTF-8">
<title>Assignment 1 (HTML) - CS 3550</title>
<link rel="icon" href="/static/favicon.ico" type="image/x-icon">
<link rel="stylesheet" type="text/css" href="/static/main.css">

<nav>
    <div>
        <h1>CS 3550</h1>
        <a href="index.html">Assignments</a>
        <a href="profile.html" title="View all assignments assigned to you">Profile</a>
    </div>
</nav>

<header>
    <h1>All assignments</h1>
</header>

<main>
    <table>
        <thead>
            <tr>
                <th>Assignment</th>
                <th>Due date</th>
                <th class="col_num">Weight</th>
            </tr>
        </thead>
        <tbody>
            {% for a in assignments %}
            <tr>
                <td><a href="/{{ a.id }}/">{{ a.title }}</a></td>
                <td>{{ a.deadline|date:"M d" }}</td>
                <td class="col_num">{{ a.weight }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</main>
